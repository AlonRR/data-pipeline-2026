name: Load queue into Supabase

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-queue-to-supabase
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: salim
    env:
      RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
      RABBITMQ_QUEUE: raw-prices
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      LOADER_EXIT_AFTER_IDLE_SECONDS: "30"
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: salim/services/loader/requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "$RABBITMQ_URL" || -z "$DATABASE_URL" ]]; then
            echo "RABBITMQ_URL and SUPABASE_DATABASE_URL repository secrets are required." >&2
            exit 1
          fi

      - name: Install loader dependencies
        run: python -m pip install --requirement services/loader/requirements.txt

      - name: Drain queue into Supabase
        run: python services/loader/main.py
