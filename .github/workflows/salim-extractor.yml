name: Salim extractor

on:
  workflow_dispatch:

concurrency:
  group: salim-extractor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: salim/services/extractor
    env:
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY: ${{ vars.SUPABASE_ACCESS_KEY_ID }}
      S3_SECRET_KEY: ${{ secrets.SUPABASE_ACCESS_SECRET_KEY }}
      RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
      S3_BUCKET: ${{ vars.S3_BUCKET || 'SalimPrices' }}
      S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
      RABBITMQ_QUEUE: ${{ vars.RABBITMQ_QUEUE || 'raw-prices' }}
      EXTRACTOR_BATCH_SIZE: ${{ vars.EXTRACTOR_BATCH_SIZE || '30' }}
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: salim/services/extractor/requirements.txt

      - name: Install extractor dependencies
        run: python -m pip install -r requirements.txt

      - name: Poll S3 delta and publish records
        run: python main.py --once
