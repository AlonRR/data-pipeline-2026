name: Crawler tests

on:
  pull_request:
    paths:
      - ".github/workflows/crawler-tests.yml"
      - "salim/crawler/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawler-tests.yml"
      - "salim/crawler/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: salim/crawler/requirements.txt

      - name: Install crawler dependencies
        # pytest is not in requirements.txt: it is a development dependency and
        # the crawler image should not carry it.
        run: |
          python -m pip install --requirement salim/crawler/requirements.txt
          python -m pip install pytest==9.1.1

      # No database and no network: these tests stub boto3 and drive the
      # crawlers against captured responses, so nothing here reaches a source.
      - name: Run crawler tests
        working-directory: salim/crawler
        run: python -m pytest tests --verbose
