name: Stores tests

on:
  pull_request:
    paths:
      - ".github/workflows/stores-tests.yml"
      - "salim/services/stores/**"
      - "salim/shared/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stores-tests.yml"
      - "salim/services/stores/**"
      - "salim/shared/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: salim/services/stores/requirements.txt

      - name: Install stores dependencies
        # pytest is not in requirements.txt: it is a development dependency and
        # the stores image should not carry it.
        run: |
          python -m pip install --requirement salim/services/stores/requirements.txt
          python -m pip install pytest==9.1.1

      # No database and no network. The enricher tests drive both locators
      # against captured live responses, and the model tests read the mapping
      # rather than a running Postgres, so nothing here reaches a chain or a DB.
      - name: Run stores tests
        working-directory: salim/services/stores
        run: python -m pytest tests --verbose
