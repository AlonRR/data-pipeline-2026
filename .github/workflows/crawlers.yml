name: Crawlers

on:
  # allow manual triggering of the workflow from the Actions tab in GitHub
  workflow_dispatch: {}

concurrency:
  group: crawlers
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120

    defaults:
      run:
        working-directory: salim/crawler

    steps:
      - uses: actions/checkout@v4

      - name: Require a Supabase S3 endpoint
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: |
          if [ -z "$S3_ENDPOINT_URL" ]; then
            echo "::error::S3_ENDPOINT_URL is not set. Set it to the Supabase project's S3 endpoint (https://<project-ref>.supabase.co/storage/v1/s3). Refusing to run, because boto3 would silently fall back to AWS S3."
            exit 1
          fi
          case "$S3_ENDPOINT_URL" in
            *amazonaws.com*)
              echo "::error::S3_ENDPOINT_URL points at AWS ($S3_ENDPOINT_URL). This pipeline stores to Supabase Storage."
              exit 1
              ;;
          esac
          echo "S3 endpoint host: $(printf '%s' "$S3_ENDPOINT_URL" | sed -E 's#^(https?://[^/]+).*#\\1#')"

      - name: Check Python is new enough
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else "need Python 3.12+")'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run all crawlers
        run: .venv/bin/python orchestrator.py
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ vars.SUPABASE_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.SUPABASE_ACCESS_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'SalimPrices' }}
          S3_REGION: ${{ secrets.S3_REGION || 'eu-central-1' }}
          # hazi_hinam, victory and super_pharm refuse GitHub's datacenter IP
          # ranges — a 403, dropped packets, and a page that parses to zero
          # links while reporting success. The same commit collects all three
          # from an Israeli IP, so this is a property of the runner, not a bug
          # in the crawlers, and it is not fixable in crawler code.
          #
          # Hosted runners therefore attempt only the five that are reachable.
          # A self-hosted runner gets the empty default and runs all eight, so
          # this must not become a hardcoded list. Set the CRAWLER_PROVIDERS
          # repository variable to override either way.
          CRAWLER_PROVIDERS: >-
            ${{ vars.CRAWLER_PROVIDERS
                || (runner.environment == 'github-hosted'
                    && 'yohananof,rami_levi,tiv_taam,shufersal,wolt'
                    || '') }}
