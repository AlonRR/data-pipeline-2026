services:
  # --- infra ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes
      POSTGRES_DB: quotes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  # --- application services ---
  crawler:
    build:
      context: ./crawler
    env_file: .env
    depends_on:
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      - rabbitmq
      - postgres

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres-data:
